<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="g-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C23"/>
      <stop offset="100%" stop-color="#121318"/>
    </linearGradient>
    <linearGradient id="google-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#34A853"/>
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="320" height="200" rx="8" fill="url(#g-grad)" stroke="#2B2F3D" stroke-width="1.2"/>
  
  <!-- Google Cloud Header -->
  <g transform="translate(20, 20)">
    <!-- Google Colors Bar -->
    <rect x="0" y="0" width="12" height="4" fill="#4285F4" rx="2"/>
    <rect x="16" y="0" width="12" height="4" fill="#EA4335" rx="2"/>
    <rect x="32" y="0" width="12" height="4" fill="#FBBC04" rx="2"/>
    <rect x="48" y="0" width="12" height="4" fill="#34A853" rx="2"/>
    <text x="70" y="6" fill="#8C93A8" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="bold">GOOGLE CLOUD SKILLS BOOST</text>
  </g>

  <!-- Badge Emblem -->
  <g transform="translate(30, 60)">
    <circle cx="28" cy="28" r="28" fill="#1E2330" stroke="#FF5500" stroke-width="2"/>
    <!-- Sparkle / AI Star -->
    <path d="M 28 14 L 31 23 L 40 25 L 32 30 L 34 39 L 28 33 L 22 39 L 24 30 L 16 25 L 25 23 Z" fill="#FF5500"/>
    <circle cx="28" cy="28" r="6" fill="#B8FF00"/>
  </g>

  <!-- Title & Details -->
  <g transform="translate(100, 60)">
    <text x="0" y="16" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold">Introduction to</text>
    <text x="0" y="34" fill="#FF5500" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold">Generative AI</text>
    <text x="0" y="54" fill="#7E8599" font-family="'JetBrains Mono', monospace" font-size="9">ISSUER: GOOGLE CLOUD</text>
    <text x="0" y="68" fill="#B8FF00" font-family="'JetBrains Mono', monospace" font-size="9">VERIFIED CREDENTIAL ✓</text>
  </g>

  <!-- Bottom Verification Footer -->
  <rect x="20" y="150" width="280" height="30" rx="4" fill="#161922" stroke="#252A38" stroke-width="0.8"/>
  <text x="32" y="169" fill="#8C93A8" font-family="'JetBrains Mono', monospace" font-size="10">LLMs // Diffusion // Foundational GenAI</text>
</svg>
