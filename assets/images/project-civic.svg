<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="civ-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#1A1C22"/>
    </linearGradient>
    <pattern id="civ-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#252A36" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#civ-bg)" rx="8"/>
  <rect width="800" height="450" fill="url(#civ-grid)" opacity="0.6" rx="8"/>

  <!-- Header -->
  <rect x="25" y="20" width="750" height="36" fill="#181A20" rx="4" stroke="#282C36" stroke-width="1"/>
  <circle cx="45" cy="38" r="5" fill="#FF5500"/>
  <circle cx="62" cy="38" r="5" fill="#B8FF00"/>
  <circle cx="79" cy="38" r="5" fill="#5A5F6E"/>
  <text x="105" y="42" fill="#8E94A0" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1">CIVIC.AI // SMART MUNICIPAL VISION &amp; DEFECT DETECTOR [CV STREAM]</text>
  <rect x="650" y="28" width="110" height="20" rx="2" fill="#242832" stroke="#B8FF00" stroke-width="0.8"/>
  <text x="660" y="42" fill="#B8FF00" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">FEED: LIVE-HD</text>

  <!-- Left: Simulated Computer Vision Feed with Bounding Boxes -->
  <g transform="translate(35, 75)">
    <rect width="420" height="305" rx="6" fill="#0C0E12" stroke="#2B303C" stroke-width="1"/>
    
    <!-- Video Canvas Wireframe Scene -->
    <path d="M 20 280 L 160 140 L 260 140 L 400 280 Z" fill="#151720" stroke="#252A36" stroke-width="1"/>
    <!-- Road Lane Markings -->
    <line x1="210" y1="140" x2="210" y2="280" stroke="#363C4E" stroke-width="2" stroke-dasharray="10,12"/>

    <!-- Pothole Bounding Box -->
    <g transform="translate(130, 200)">
      <rect width="110" height="55" rx="2" fill="#FF5500" fill-opacity="0.15" stroke="#FF5500" stroke-width="2"/>
      <rect x="0" y="-18" width="110" height="18" fill="#FF5500"/>
      <text x="5" y="-5" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">POTHOLE: 96.8%</text>
      <!-- Simulated pothole contour -->
      <ellipse cx="55" cy="28" rx="40" ry="16" fill="#0A0B0E" stroke="#FF8833" stroke-width="1.2"/>
    </g>

    <!-- Water Leakage Bounding Box -->
    <g transform="translate(265, 170)">
      <rect width="100" height="50" rx="2" fill="#00E5FF" fill-opacity="0.15" stroke="#00E5FF" stroke-width="1.8"/>
      <rect x="0" y="-18" width="100" height="18" fill="#00E5FF"/>
      <text x="5" y="-5" fill="#0C0E12" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">WATER LEAK: 92%</text>
      <!-- Simulated leak puddles -->
      <ellipse cx="50" cy="25" rx="35" ry="12" fill="#0E232E" stroke="#00E5FF" stroke-width="1"/>
    </g>

    <!-- Garbage/Debris Bounding Box -->
    <g transform="translate(40, 150)">
      <rect width="90" height="50" rx="2" fill="#B8FF00" fill-opacity="0.15" stroke="#B8FF00" stroke-width="1.8"/>
      <rect x="0" y="-18" width="90" height="18" fill="#B8FF00"/>
      <text x="5" y="-5" fill="#0C0E12" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">GARBAGE: 94.1%</text>
    </g>

    <!-- Camera Overlay Details -->
    <text x="20" y="30" fill="#B8FF00" font-family="'JetBrains Mono', monospace" font-size="11">● CAM-04 [WARD 07 - NORTH CORRIDOR]</text>
    <text x="20" y="48" fill="#6B7280" font-family="'JetBrains Mono', monospace" font-size="9">FPS: 30.2 // MODEL: YOLO-v8 / ROBOFLOW CUSTOM</text>
  </g>

  <!-- Right: Dispatcher Analytics & Automated Municipal Work Orders -->
  <g transform="translate(480, 75)">
    <rect width="285" height="305" rx="6" fill="#16181F" stroke="#2B303C" stroke-width="1"/>
    <text x="18" y="28" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="bold">AUTONOMOUS TICKET DISPATCH</text>
    <text x="18" y="46" fill="#6B7280" font-family="'JetBrains Mono', monospace" font-size="10">CIVIC OPERATIONS DESK</text>

    <!-- Work order 1 -->
    <g transform="translate(14, 60)">
      <rect width="257" height="60" rx="4" fill="#20232C" stroke="#FF5500" stroke-width="0.8"/>
      <text x="12" y="20" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">TICKET #841 - POTHOLE</text>
      <text x="12" y="36" fill="#FF8833" font-family="'JetBrains Mono', monospace" font-size="9">Severity: Critical // Ward 7</text>
      <text x="12" y="50" fill="#8E94A0" font-family="'JetBrains Mono', monospace" font-size="9">Auto-dispatched to PWD Crew #3</text>
    </g>

    <!-- Work order 2 -->
    <g transform="translate(14, 130)">
      <rect width="257" height="60" rx="4" fill="#20232C" stroke="#00E5FF" stroke-width="0.8"/>
      <text x="12" y="20" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">TICKET #842 - WATER LEAK</text>
      <text x="12" y="36" fill="#00E5FF" font-family="'JetBrains Mono', monospace" font-size="9">Severity: High // Ward 7 Junction</text>
      <text x="12" y="50" fill="#8E94A0" font-family="'JetBrains Mono', monospace" font-size="9">Alerted Water Supply Board</text>
    </g>

    <!-- Work order 3 -->
    <g transform="translate(14, 200)">
      <rect width="257" height="60" rx="4" fill="#20232C" stroke="#B8FF00" stroke-width="0.8"/>
      <text x="12" y="20" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">TICKET #843 - SOLID WASTE</text>
      <text x="12" y="36" fill="#B8FF00" font-family="'JetBrains Mono', monospace" font-size="9">Severity: Moderate // Sidewalk</text>
      <text x="12" y="50" fill="#8E94A0" font-family="'JetBrains Mono', monospace" font-size="9">Scheduled for Sanitation Route 12</text>
    </g>

    <text x="18" y="285" fill="#8E94A0" font-family="'JetBrains Mono', monospace" font-size="10">> FLASK REST API + REACT DASHBOARD</text>
  </g>

  <!-- Bottom Technical Footer Bar -->
  <text x="40" y="415" fill="#5A606F" font-family="'JetBrains Mono', monospace" font-size="11">PYTHON // TENSORFLOW // ROBOFLOW // FLASK // REACT // OBJECT DETECTION &amp; SEGMENTATION</text>
</svg>
