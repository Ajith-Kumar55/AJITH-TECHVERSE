  <!-- Flow Connector 2 -->
  <path d="M 510 230 L 570 230" stroke="#B8FF00" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="570,227 578,230 570,233" fill="#B8FF00"/>

  <!-- Stage 3: Defense & Alert Dispatch -->
  <g transform="translate(580, 90)">
    <rect width="180" height="280" rx="6" fill="#16181F" stroke="#2E323D" stroke-width="1"/>
    <rect x="12" y="14" width="6" height="16" fill="#FF5500"/>
    <text x="26" y="26" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="bold">03. DEFENSE MATRIX</text>
    <text x="14" y="44" fill="#6C7280" font-family="'JetBrains Mono', monospace" font-size="10">REALTIME MITIGATION</text>

    <!-- Alert Cards -->
    <g transform="translate(14, 60)">
      <rect width="152" height="42" rx="4" fill="#261412" stroke="#FF5500" stroke-width="1"/>
      <text x="10" y="20" fill="#FF5500" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">⚠️ DDoS MITIGATED</text>
      <text x="10" y="34" fill="#D49A94" font-family="'JetBrains Mono', monospace" font-size="9">SYN Flood drop 10.4.8.1</text>

      <rect y="54" width="152" height="42" rx="4" fill="#132415" stroke="#B8FF00" stroke-width="0.8"/>
      <text x="10" y="74" fill="#B8FF00" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">✓ NORMAL TRAFFIC</text>
      <text x="10" y="88" fill="#99BFA0" font-family="'JetBrains Mono', monospace" font-size="9">Encrypted TLS 1.3 OK</text>

      <rect y="108" width="152" height="42" rx="4" fill="#241B12" stroke="#FF8833" stroke-width="0.8"/>
      <text x="10" y="128" fill="#FF8833" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">⚡ PORT SCAN HALT</text>
      <text x="10" y="142" fill="#CAA685" font-family="'JetBrains Mono', monospace" font-size="9">Heuristic signature blocked</text>
    </g>
    <rect x="14" y="235" width="152" height="26" rx="3" fill="#20232B" stroke="#363C4A" stroke-width="0.8"/>
    <text x="24" y="252" fill="#B8FF00" font-family="'JetBrains Mono', monospace" font-size="10">● SYSTEM HARDENED</text>
  </g>

  <!-- Bottom Technical Footer Bar -->
  <text x="40" y="415" fill="#5A606F" font-family="'JetBrains Mono', monospace" font-size="11">SCIKIT-LEARN // FASTAPI // GRADIENT BOOSTING // DOCKER CONTAINERIZED // REPORTED ACCURACY 99.68%</text>
</svg>
