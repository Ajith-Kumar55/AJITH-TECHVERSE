<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ng-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#1B1D22"/>
    </linearGradient>
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#FF8833"/>
    </linearGradient>
    <linearGradient id="lime-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8FF00"/>
      <stop offset="100%" stop-color="#80DD00"/>
    </linearGradient>
    <pattern id="grid-pattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#252830" stroke-width="0.8"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#ng-bg)" rx="8"/>
  <rect width="800" height="450" fill="url(#grid-pattern)" opacity="0.6" rx="8"/>

  <!-- Technical Header -->
  <rect x="25" y="20" width="750" height="36" fill="#181A20" rx="4" stroke="#2A2D36" stroke-width="1"/>
  <circle cx="45" cy="38" r="5" fill="#FF5500"/>
  <circle cx="62" cy="38" r="5" fill="#B8FF00"/>
  <circle cx="79" cy="38" r="5" fill="#5A5F6E"/>
  <text x="105" y="42" fill="#8E94A0" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1">NETGUARD.AI // ML PACKET INTRUSION PIPELINE [SYS_VER 4.2]</text>
  <rect x="670" y="28" width="90" height="20" rx="2" fill="#242832" stroke="#FF5500" stroke-width="0.8"/>
  <text x="682" y="42" fill="#FF5500" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">ACC: 99.68%</text>

  <!-- Pipeline Stages -->
  <!-- Stage 1: Ingestion -->
  <g transform="translate(40, 90)">
    <rect width="180" height="280" rx="6" fill="#16181F" stroke="#2E323D" stroke-width="1"/>
    <rect x="12" y="14" width="6" height="16" fill="#FF5500"/>
    <text x="26" y="26" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="bold">01. INGESTION</text>
    <text x="14" y="44" fill="#6C7280" font-family="'JetBrains Mono', monospace" font-size="10">RAW PACKET CAPTURE</text>

    <!-- Packet Stream Viz -->
    <g transform="translate(14, 60)">
      <rect width="152" height="34" rx="4" fill="#20232B" stroke="#2D323E" stroke-width="0.8"/>
      <text x="10" y="21" fill="#A0A5B2" font-family="'JetBrains Mono', monospace" font-size="10">TCP/UDP SYN STREAM</text>
      <circle cx="138" cy="17" r="4" fill="#B8FF00"/>

      <rect y="44" width="152" height="34" rx="4" fill="#20232B" stroke="#2D323E" stroke-width="0.8"/>
      <text x="10" y="65" fill="#A0A5B2" font-family="'JetBrains Mono', monospace" font-size="10">FLOW DURATION SEC</text>
      <circle cx="138" cy="61" r="4" fill="#FF5500"/>

      <rect y="88" width="152" height="34" rx="4" fill="#20232B" stroke="#2D323E" stroke-width="0.8"/>
      <text x="10" y="109" fill="#A0A5B2" font-family="'JetBrains Mono', monospace" font-size="10">PAYLOAD OCTET RATIO</text>
      <circle cx="138" cy="105" r="4" fill="#B8FF00"/>

      <rect y="132" width="152" height="34" rx="4" fill="#20232B" stroke="#2D323E" stroke-width="0.8"/>
      <text x="10" y="153" fill="#A0A5B2" font-family="'JetBrains Mono', monospace" font-size="10">FASTAPI ASYNC HOOK</text>
      <circle cx="138" cy="149" r="4" fill="#FF8833"/>
    </g>
    <text x="14" y="260" fill="#00E5FF" font-family="'JetBrains Mono', monospace" font-size="9">> DOCKER HOST CONTAINER</text>
  </g>

  <!-- Flow Connector 1 -->
  <path d="M 220 230 L 290 230" stroke="#FF5500" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="290,227 298,230 290,233" fill="#FF5500"/>

  <!-- Stage 2: Feature Engineering & Gradient Boosting -->
  <g transform="translate(300, 80)">
    <rect width="210" height="300" rx="6" fill="#16181F" stroke="#FF5500" stroke-width="1.2" filter="url(#glow)"/>
    <rect width="210" height="300" rx="6" fill="#16181F" stroke="#FF5500" stroke-width="1.2"/>
    <rect x="12" y="14" width="6" height="16" fill="#B8FF00"/>
    <text x="26" y="26" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="bold">02. ML ENSEMBLE</text>
    <text x="14" y="44" fill="#B8FF00" font-family="'JetBrains Mono', monospace" font-size="10">GRADIENT BOOSTING CORE</text>

    <!-- Decision Tree Topology Viz -->
    <g transform="translate(15, 65)">
      <!-- Root -->
      <rect x="65" y="0" width="50" height="24" rx="3" fill="#252A36" stroke="#B8FF00" stroke-width="1"/>
      <text x="73" y="16" fill="#B8FF00" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">ROOT</text>

      <!-- Branches -->
      <path d="M 90 24 L 45 52 M 90 24 L 135 52" stroke="#505666" stroke-width="1.2"/>
      <rect x="20" y="52" width="50" height="22" rx="3" fill="#1C1F28" stroke="#3F4554" stroke-width="0.8"/>
      <text x="26" y="66" fill="#A0A5B2" font-family="'JetBrains Mono', monospace" font-size="8">NODE_A</text>

      <rect x="110" y="52" width="50" height="22" rx="3" fill="#1C1F28" stroke="#3F4554" stroke-width="0.8"/>
      <text x="116" y="66" fill="#A0A5B2" font-family="'JetBrains Mono', monospace" font-size="8">NODE_B</text>

      <!-- Sub Branches -->
      <path d="M 45 74 L 20 100 M 45 74 L 65 100 M 135 74 L 115 100 M 135 74 L 155 100" stroke="#505666" stroke-width="1"/>
      <circle cx="20" cy="104" r="5" fill="#B8FF00"/>
      <circle cx="65" cy="104" r="5" fill="#FF5500"/>
      <circle cx="115" cy="104" r="5" fill="#B8FF00"/>
      <circle cx="155" cy="104" r="5" fill="#FF5500"/>
    </g>

    <!-- Metrics Box -->
    <rect x="14" y="195" width="182" height="85" rx="4" fill="#0E1014" stroke="#252934" stroke-width="1"/>
    <text x="24" y="215" fill="#8E94A0" font-family="'JetBrains Mono', monospace" font-size="9">PRECISION:  99.72%</text>
    <text x="24" y="232" fill="#8E94A0" font-family="'JetBrains Mono', monospace" font-size="9">RECALL:     99.64%</text>
    <text x="24" y="249" fill="#8E94A0" font-family="'JetBrains Mono', monospace" font-size="9">F1-SCORE:   99.68%</text>
    <text x="24" y="266" fill="#B8FF00" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">LATENCY:    &lt; 4.2ms</text>
