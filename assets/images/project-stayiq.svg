<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="siq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#181B22"/>
    </linearGradient>
    <pattern id="siq-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#232732" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="chart-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#siq-bg)" rx="8"/>
  <rect width="800" height="450" fill="url(#siq-grid)" opacity="0.6" rx="8"/>

  <!-- Technical Header -->
  <rect x="25" y="20" width="750" height="36" fill="#181A20" rx="4" stroke="#282C36" stroke-width="1"/>
  <circle cx="45" cy="38" r="5" fill="#FF5500"/>
  <circle cx="62" cy="38" r="5" fill="#B8FF00"/>
  <circle cx="79" cy="38" r="5" fill="#5A5F6E"/>
  <text x="105" y="42" fill="#8E94A0" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1">STAYIQ // AIRBNB BOOKING &amp; YIELD INTELLIGENCE PLATFORM [ML ENGINE]</text>
  <rect x="650" y="28" width="110" height="20" rx="2" fill="#242832" stroke="#B8FF00" stroke-width="0.8"/>
  <text x="660" y="42" fill="#B8FF00" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">DEMAND: HIGH</text>

  <!-- Left: Analytical Metric Cards & Gauges -->
  <g transform="translate(35, 75)">
    <!-- Metric 1: Dynamic Price Prediction -->
    <rect width="220" height="95" rx="6" fill="#16181F" stroke="#2B303C" stroke-width="1"/>
    <text x="16" y="26" fill="#8E94A0" font-family="'Space Grotesk', sans-serif" font-size="11">PRICE OPTIMIZATION MODEL</text>
    <text x="16" y="58" fill="#FFFFFF" font-family="'Syne', sans-serif" font-size="28" font-weight="bold">$184.50<tspan font-size="14" fill="#B8FF00"> /nt</tspan></text>
    <text x="16" y="80" fill="#B8FF00" font-family="'JetBrains Mono', monospace" font-size="10">▲ +14.2% REVPAR BOOST</text>

    <!-- Metric 2: Cancellation Risk Classifier -->
    <g transform="translate(0, 110)">
      <rect width="220" height="95" rx="6" fill="#16181F" stroke="#2B303C" stroke-width="1"/>
      <text x="16" y="26" fill="#8E94A0" font-family="'Space Grotesk', sans-serif" font-size="11">CANCELLATION RISK INDEX</text>
      <text x="16" y="58" fill="#FF5500" font-family="'Syne', sans-serif" font-size="28" font-weight="bold">12.4%</text>
      <rect x="16" y="70" width="188" height="6" rx="3" fill="#232732"/>
      <rect x="16" y="70" width="45" height="6" rx="3" fill="#FF5500"/>
      <text x="70" y="88" fill="#8E94A0" font-family="'JetBrains Mono', monospace" font-size="9">LOW CHURN PROBABILITY</text>
    </g>

    <!-- Metric 3: Stack Badges -->
    <g transform="translate(0, 220)">
      <rect width="220" height="90" rx="6" fill="#16181F" stroke="#2B303C" stroke-width="1"/>
      <text x="16" y="24" fill="#8E94A0" font-family="'Space Grotesk', sans-serif" font-size="11">DATA ARCHITECTURE</text>
      <text x="16" y="46" fill="#D0D5E0" font-family="'JetBrains Mono', monospace" font-size="10">> React + TypeScript UI</text>
      <text x="16" y="64" fill="#D0D5E0" font-family="'JetBrains Mono', monospace" font-size="10">> FastAPI &amp; SQLAlchemy</text>
      <text x="16" y="82" fill="#D0D5E0" font-family="'JetBrains Mono', monospace" font-size="10">> Scikit-Learn Regression</text>
    </g>
  </g>

  <!-- Right: Demand Curve & Multi-feature Forecasting Chart -->
  <g transform="translate(280, 75)">
    <rect width="485" height="305" rx="6" fill="#16181F" stroke="#2B303C" stroke-width="1"/>
    <text x="20" y="28" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold">SEASONAL DEMAND &amp; OCCUPANCY FORECAST MATRIX</text>
    <text x="20" y="46" fill="#6B7280" font-family="'JetBrains Mono', monospace" font-size="10">90-DAY PREDICTIVE HORIZON // AIRBNB BENCHMARK DATASET</text>

    <!-- Chart Grid Lines -->
    <g transform="translate(30, 65)">
      <line x1="0" y1="0" x2="425" y2="0" stroke="#252A36" stroke-width="1"/>
      <text x="-25" y="4" fill="#565B68" font-family="'JetBrains Mono', monospace" font-size="9">100%</text>
      <line x1="0" y1="45" x2="425" y2="45" stroke="#252A36" stroke-width="1"/>
      <text x="-25" y="49" fill="#565B68" font-family="'JetBrains Mono', monospace" font-size="9">75%</text>
      <line x1="0" y1="90" x2="425" y2="90" stroke="#252A36" stroke-width="1"/>
      <text x="-25" y="94" fill="#565B68" font-family="'JetBrains Mono', monospace" font-size="9">50%</text>
      <line x1="0" y1="135" x2="425" y2="135" stroke="#252A36" stroke-width="1"/>
      <text x="-25" y="139" fill="#565B68" font-family="'JetBrains Mono', monospace" font-size="9">25%</text>
      <line x1="0" y1="180" x2="425" y2="180" stroke="#373D4D" stroke-width="1.2"/>
      <text x="-25" y="184" fill="#565B68" font-family="'JetBrains Mono', monospace" font-size="9">0%</text>

      <!-- Shaded Area Chart -->
      <path d="M 0 140 Q 60 110 110 70 T 210 50 T 310 30 T 425 10 L 425 180 L 0 180 Z" fill="url(#chart-area)"/>

      <!-- Predicted Curve Line -->
      <path d="M 0 140 Q 60 110 110 70 T 210 50 T 310 30 T 425 10" fill="none" stroke="#FF5500" stroke-width="3"/>

      <!-- Baseline Comparison Curve -->
      <path d="M 0 160 Q 70 140 140 120 T 280 110 T 425 80" fill="none" stroke="#B8FF00" stroke-width="2" stroke-dasharray="4,4"/>

      <!-- Highlight Data Points -->
      <circle cx="110" cy="70" r="5" fill="#FF5500" stroke="#FFFFFF" stroke-width="1.5"/>
      <circle cx="210" cy="50" r="5" fill="#FF5500" stroke="#FFFFFF" stroke-width="1.5"/>
      <circle cx="310" cy="30" r="5" fill="#FF5500" stroke="#FFFFFF" stroke-width="1.5"/>
      <circle cx="425" cy="10" r="5" fill="#B8FF00" stroke="#FFFFFF" stroke-width="1.5"/>

      <!-- Annotations -->
      <rect x="180" y="8" width="100" height="22" rx="3" fill="#241B12" stroke="#FF5500" stroke-width="0.8"/>
      <text x="188" y="22" fill="#FF8833" font-family="'JetBrains Mono', monospace" font-size="9">PEAK DEMAND: 94%</text>

      <!-- Time Axis -->
      <text x="0" y="200" fill="#6B7280" font-family="'JetBrains Mono', monospace" font-size="9">WEEK 01</text>
      <text x="100" y="200" fill="#6B7280" font-family="'JetBrains Mono', monospace" font-size="9">WEEK 04</text>
      <text x="200" y="200" fill="#6B7280" font-family="'JetBrains Mono', monospace" font-size="9">WEEK 08</text>
      <text x="300" y="200" fill="#6B7280" font-family="'JetBrains Mono', monospace" font-size="9">WEEK 12</text>
      <text x="390" y="200" fill="#B8FF00" font-family="'JetBrains Mono', monospace" font-size="9">PEAK FORECAST</text>
    </g>
  </g>

  <!-- Bottom Technical Footer Bar -->
  <text x="40" y="415" fill="#5A606F" font-family="'JetBrains Mono', monospace" font-size="11">PYTHON // REACT // TYPESCRIPT // FASTAPI // SQLALCHEMY // SCIKIT-LEARN // DYNAMIC PRICING ENGINE</text>
</svg>
