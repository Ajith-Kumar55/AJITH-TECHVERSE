<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="hl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#191D1A"/>
    </linearGradient>
    <pattern id="hl-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#212923" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#hl-bg)" rx="8"/>
  <rect width="800" height="450" fill="url(#hl-grid)" opacity="0.6" rx="8"/>

  <!-- Header -->
  <rect x="25" y="20" width="750" height="36" fill="#181A20" rx="4" stroke="#282C36" stroke-width="1"/>
  <circle cx="45" cy="38" r="5" fill="#FF5500"/>
  <circle cx="62" cy="38" r="5" fill="#B8FF00"/>
  <circle cx="79" cy="38" r="5" fill="#5A5F6E"/>
  <text x="105" y="42" fill="#8E94A0" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1">HARVESTLINK // AI-POWERED AGRI COMMERCE &amp; ADVISORY ECOSYSTEM [FLUTTER/DART]</text>
  <rect x="660" y="28" width="100" height="20" rx="2" fill="#242832" stroke="#B8FF00" stroke-width="0.8"/>
  <text x="670" y="42" fill="#B8FF00" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">MARKET: LIVE</text>

  <!-- Left: Mobile App Device Frame Mockup -->
  <g transform="translate(60, 75)">
    <!-- Phone Chassis -->
    <rect width="180" height="310" rx="24" fill="#0C0E11" stroke="#3A404F" stroke-width="2"/>
    <rect x="10" y="10" width="160" height="290" rx="16" fill="#151A18"/>
    <!-- Speaker & Notch -->
    <rect x="65" y="16" width="50" height="5" rx="2" fill="#282E2B"/>

    <!-- Screen Content -->
    <text x="24" y="42" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="bold">HarvestLink App</text>
    <text x="24" y="55" fill="#B8FF00" font-family="'JetBrains Mono', monospace" font-size="8">ಕೃಷಿ ಸಹಾಯಕ (Kannada/Eng)</text>

    <!-- Product Card 1 -->
    <rect x="20" y="65" width="140" height="55" rx="6" fill="#202A24" stroke="#2F4034" stroke-width="0.8"/>
    <circle cx="40" cy="92" r="14" fill="#2E4A35"/>
    <text x="35" y="96" fill="#B8FF00" font-size="12">🌾</text>
    <text x="62" y="85" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="bold">Sona Masoori</text>
    <text x="62" y="97" fill="#B8FF00" font-family="'JetBrains Mono', monospace" font-size="9">₹3,400 / Qtl</text>
    <text x="62" y="109" fill="#8FA495" font-family="'JetBrains Mono', monospace" font-size="8">Farmer: Mandya Hub</text>

    <!-- AI Advisory Banner -->
    <rect x="20" y="130" width="140" height="60" rx="6" fill="#292015" stroke="#FF5500" stroke-width="0.8"/>
    <text x="28" y="146" fill="#FF5500" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">AI CROP ADVISORY</text>
    <text x="28" y="160" fill="#E8D1BE" font-family="'Space Grotesk', sans-serif" font-size="8">Rain predicted in 48h.</text>
    <text x="28" y="172" fill="#E8D1BE" font-family="'Space Grotesk', sans-serif" font-size="8">Delay pesticide spray.</text>
    <text x="28" y="184" fill="#B8FF00" font-family="'JetBrains Mono', monospace" font-size="7">> Audio in Kannada 🔊</text>

    <!-- Order Tracking -->
    <rect x="20" y="200" width="140" height="55" rx="6" fill="#1C212E" stroke="#35405A" stroke-width="0.8"/>
    <text x="28" y="218" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">ORDER #HL-882</text>
    <text x="28" y="232" fill="#00E5FF" font-family="'JetBrains Mono', monospace" font-size="8">Status: In Transit</text>
    <line x1="28" y1="242" x2="148" y2="242" stroke="#35405A" stroke-width="3"/>
    <line x1="28" y1="242" x2="110" y2="242" stroke="#00E5FF" stroke-width="3"/>

    <!-- Bottom Nav -->
    <rect x="10" y="265" width="160" height="35" rx="4" fill="#121514"/>
    <circle cx="40" cy="282" r="6" fill="#B8FF00"/>
    <circle cx="90" cy="282" r="6" fill="#58635B"/>
    <circle cx="140" cy="282" r="6" fill="#58635B"/>
  </g>

  <!-- Middle Connector & Architecture -->
  <g transform="translate(280, 85)">
    <rect width="470" height="295" rx="6" fill="#16181F" stroke="#2B303C" stroke-width="1"/>
    <text x="20" y="28" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold">CROSS-PLATFORM ARCHITECTURE &amp; ROLE WORKFLOW</text>
    <text x="20" y="46" fill="#6B7280" font-family="'JetBrains Mono', monospace" font-size="10">FLUTTER + PROVIDER STATE MGMT // RESTFUL APIS</text>

    <!-- 3 Roles Diagram -->
    <g transform="translate(20, 65)">
      <!-- Role 1: Farmer -->
      <rect width="130" height="95" rx="5" fill="#1E2822" stroke="#B8FF00" stroke-width="1"/>
      <text x="12" y="22" fill="#B8FF00" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">01. FARMER</text>
      <text x="12" y="40" fill="#E0E6E2" font-family="'Space Grotesk', sans-serif" font-size="9">• Direct Produce Listing</text>
      <text x="12" y="55" fill="#E0E6E2" font-family="'Space Grotesk', sans-serif" font-size="9">• Realtime MSP Insights</text>
      <text x="12" y="70" fill="#E0E6E2" font-family="'Space Grotesk', sans-serif" font-size="9">• Voice AI Support</text>
      <text x="12" y="85" fill="#B8FF00" font-family="'JetBrains Mono', monospace" font-size="8">Kannada &amp; English</text>

      <!-- Role 2: Consumer -->
      <g transform="translate(150, 0)">
        <rect width="130" height="95" rx="5" fill="#24212C" stroke="#A78BFA" stroke-width="1"/>
        <text x="12" y="22" fill="#A78BFA" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">02. BUYER</text>
        <text x="12" y="40" fill="#E0E6E2" font-family="'Space Grotesk', sans-serif" font-size="9">• Wholesale Cart</text>
        <text x="12" y="55" fill="#E0E6E2" font-family="'Space Grotesk', sans-serif" font-size="9">• Transparent Traceability</text>
        <text x="12" y="70" fill="#E0E6E2" font-family="'Space Grotesk', sans-serif" font-size="9">• Farm-gate Pricing</text>
        <text x="12" y="85" fill="#A78BFA" font-family="'JetBrains Mono', monospace" font-size="8">Zero Middlemen</text>
      </g>

      <!-- Role 3: Logistics Hub -->
      <g transform="translate(300, 0)">
        <rect width="130" height="95" rx="5" fill="#2B2016" stroke="#FF5500" stroke-width="1"/>
        <text x="12" y="22" fill="#FF5500" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">03. LOGISTICS</text>
        <text x="12" y="40" fill="#E0E6E2" font-family="'Space Grotesk', sans-serif" font-size="9">• Route Optimization</text>
        <text x="12" y="55" fill="#E0E6E2" font-family="'Space Grotesk', sans-serif" font-size="9">• Geofenced Pickups</text>
        <text x="12" y="70" fill="#E0E6E2" font-family="'Space Grotesk', sans-serif" font-size="9">• Dispatch SLA Radar</text>
        <text x="12" y="85" fill="#FF8833" font-family="'JetBrains Mono', monospace" font-size="8">Live Waybill Tracking</text>
      </g>
    </g>

    <!-- Provider State Pipeline Bar -->
    <g transform="translate(20, 185)">
      <rect width="430" height="85" rx="4" fill="#0E1015" stroke="#252A36" stroke-width="1"/>
      <text x="16" y="24" fill="#8E94A0" font-family="'JetBrains Mono', monospace" font-size="10">PROVIDER STATE MANAGEMENT ARCHITECTURE</text>
      <text x="16" y="44" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="9">UI (Flutter Widgets) ➔ ChangeNotifier (Store) ➔ REST Client (HTTP)</text>
      <text x="16" y="62" fill="#B8FF00" font-family="'JetBrains Mono', monospace" font-size="9">✓ Role-Based JWT Auth  ✓ Offline Hive Cache  ✓ Multilingual Localization</text>
    </g>
  </g>

  <!-- Bottom Technical Footer Bar -->
  <text x="40" y="415" fill="#5A606F" font-family="'JetBrains Mono', monospace" font-size="11">FLUTTER // DART // PROVIDER ARCHITECTURE // RESTFUL BACKEND // MULTILINGUAL AGRI-COMMERCE</text>
</svg>
