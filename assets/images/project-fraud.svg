      <text x="60" y="55" fill="#8E94A0" font-family="'JetBrains Mono', monospace" font-size="9">MERCHANT FREQ</text>
      <text x="0" y="98" text-anchor="middle" fill="#8E94A0" font-family="'JetBrains Mono', monospace" font-size="9">DEVICE RISK</text>
      <text x="-95" y="20" fill="#8E94A0" font-family="'JetBrains Mono', monospace" font-size="9">TIME OF DAY</text>
      <text x="-95" y="-50" fill="#8E94A0" font-family="'JetBrains Mono', monospace" font-size="9">IP REPUTATION</text>
