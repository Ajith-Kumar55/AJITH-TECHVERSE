        <text x="35" y="36" fill="#99BFA0" font-family="'JetBrains Mono', monospace" font-size="9">Usual merchant pattern verified: Card Present</text>
        <rect x="235" y="14" width="65" height="20" rx="2" fill="#14301A"/>
        <text x="242" y="28" fill="#B8FF00" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">RISK: 0.03</text>
