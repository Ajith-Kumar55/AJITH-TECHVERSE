      <circle cx="45" cy="35" r="4" fill="#FF5500"/>
      <circle cx="0" cy="65" r="4" fill="#FF5500"/>
      <circle cx="-55" cy="10" r="4" fill="#FF5500"/>
      <circle cx="-30" cy="-45" r="4" fill="#FF5500"/>

