  <!-- Bottom Technical Footer Bar -->
  <text x="40" y="415" fill="#5A606F" font-family="'JetBrains Mono', monospace" font-size="11">PYTHON // FLASK // REACT // SCIKIT-LEARN // ISOLATION FORESTS // ANOMALY DETECTION ENGINE</text>
</svg>
