        <circle cx="20" cy="24" r="6" fill="#FF8833"/>
        <text x="35" y="20" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">TX_99480 // $750.00</text>
        <text x="35" y="36" fill="#CAA685" font-family="'JetBrains Mono', monospace" font-size="9">Device fingerprint change: Multiple accounts</text>
